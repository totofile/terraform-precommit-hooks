# This configuration keeps the repo clean and consistent before commit/push.
# It is intentionally local-first and should complement CI checks.

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.0.0"

repos:
  # Generic file and Git hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Secret scanning for accidental credentials or tokens.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Terraform-specific validation, linting, and compliance.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tool-version=1.16.4
      - id: terraform_validate
        args:
          - --hook-config=--tool-version=1.16.4
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-backend=false
      - id: terraform_providers_lock
        args:
          - --hook-config=--mode=check-lockfile-is-cross-platform
          - --args=-platform=linux_amd64
      - id: terraform_tflint
        args:
          - --hook-config=--tool-version=0.64.0
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_checkov
        args:
          - --args=--config-file=__GIT_WORKING_DIR__/.checkov.yaml

  # Team conventions for clean commit history and predictable branch names.
  - repo: local
    hooks:
      - id: conventional-commit
        name: Commit message follows Conventional Commits
        language: pygrep
        entry: '\A(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: \S'
        args: [--multiline, --negate]
        stages: [commit-msg]

      - id: branch-name
        name: Branch name is feature|bugfix|hotfix/<description>
        language: system
        entry: >-
          bash -c '[[ "$(git rev-parse --abbrev-ref HEAD)" =~ ^(feature|bugfix|hotfix)/[a-z0-9]+(-[a-z0-9]+)*$ ]]
          || { echo "Invalid branch name. Expected: feature|bugfix|hotfix/<description> in lowercase with hyphens"; exit 1; }'
        pass_filenames: false
        always_run: true
        stages: [pre-push]
